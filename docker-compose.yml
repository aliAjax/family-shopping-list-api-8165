services:
  mysql:
    image: mysql:8.0
    container_name: family-shopping-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: ${DB_NAME:-family_shopping}
      MYSQL_USER: ${DB_USER:-shopping}
      MYSQL_PASSWORD: ${DB_PASSWORD:-shopping_secret}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "13306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_secret"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: family-shopping-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-shopping}
      DB_PASSWORD: ${DB_PASSWORD:-shopping_secret}
      DB_NAME: ${DB_NAME:-family_shopping}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret}
      TOKEN_TTL_HOURS: ${TOKEN_TTL_HOURS:-24}
      MIGRATIONS_DIR: ./migrations
    ports:
      - "18091:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

volumes:
  mysql_data:
